<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Side Quest</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>Side Quest</h1>
    <p class="lede">Set up the outing, add what each person wants, and get one deck of places that fits the whole group.</p>

    <form id="plan-form">
      <section>
        <h2>The outing</h2>
        <fieldset>
          <legend>Borough(s)</legend>
          <div id="boroughs" class="choices"></div>
        </fieldset>
        <div class="row">
          <label>How many people
            <select name="group_size" id="group-size">
              <option value="2">2</option><option value="3" selected>3</option>
              <option value="4">4</option><option value="5">5</option>
            </select>
          </label>
          <label>When <input type="datetime-local" name="when" id="when" required></label>
        </div>
      </section>

      <section>
        <h2>Each person</h2>
        <p class="note">Budgets use Google's price levels ($ to $$$$) and count as a hard limit: the deck never goes above the lowest one.</p>
        <div id="members"></div>
      </section>

      <button type="submit">Show our deck</button>
    </form>

    <p id="message" class="message" hidden></p>

    <section id="results" hidden>
      <h2>Your deck</h2>
      <p id="limits" class="note"></p>
      <ol id="deck" class="deck"></ol>
    </section>
  </main>

  <template id="member-template">
    <fieldset class="member">
      <legend></legend>
      <div class="row">
        <label>Name <input name="name" maxlength="40" required></label>
        <label>Max spend per person <select name="max_price"></select></label>
      </div>
      <div class="sub">Activities</div>
      <div class="choices categories"></div>
      <div class="sub">Extras (optional)</div>
      <div class="choices toggles"></div>
      <label class="check"><input type="checkbox" name="needs_wheelchair"> Needs a wheelchair-accessible entrance</label>
    </fieldset>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
